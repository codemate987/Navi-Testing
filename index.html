.grid{display:grid;gap:16px}.kpi{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}.two{grid-template-columns:1.45fr 1fr}.three{grid-template-columns:repeat(3,1fr)}

.kcard{position:relative;overflow:hidden}.kcard:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-28px;top:-28px;background:var(--c);opacity:.08}.kicon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c);font-size:18px}.kv{font-size:26px;font-weight:800;margin-top:10px}.kl{font-size:12px;color:var(--muted)}.trend{font-size:11px;color:var(--green);margin-top:3px}

.metric{display:flex;align-items:center;gap:14px}.metric strong{font-size:22px}.minirow{display:flex;justify-content:space-between;margin:10px 0 5px;font-size:12px}.minirow span:last-child{font-weight:700}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#fafbfc}.tw{overflow:auto}tbody tr:hover{background:#fafcff}
.searchbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px;margin-bottom:14px}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:#8ba2ff;box-shadow:0 0 0 3px #3b5bdb12}label{font-size:11px;color:var(--muted);display:block;margin:0 0 4px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field.full{grid-column:1/-1}
.testnav{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.testtab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;white-space:nowrap}.testtab.on{background:#172650;color:#fff;border-color:#172650}.testtab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#bfc6d4;margin-right:6px}.testtab.done .dot{background:var(--green)}
.alert{padding:11px 13px;border-radius:11px;background:#fff7df;border:1px solid #f0d89b;color:#805a00;font-size:12px}.success{background:#eaf9f2;border-color:#bdebd6;color:#08764d}.danger{background:#fff0f1;border-color:#f4c3c8;color:#a82e3a}
.stepper{display:flex;gap:0;margin:10px 0 20px}.step{flex:1;position:relative;text-align:center;font-size:10px;color:var(--muted)}.step:before{content:"";display:block;width:28px;height:28px;margin:auto;border-radius:50%;background:#edf0f5;border:2px solid #dfe4ed;line-height:24px}.step.done:before{content:"✓";background:#eaf9f2;border-color:#bdebd6;color:var(--green);font-weight:800}.step.active:before{background:#eef3ff;border-color:#8ba2ff;color:var(--blue)}.step:not(:last-child):after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:#e4e8ef;z-index:-1}.step.done:not(:last-child):after{background:#9fdfc4}
.timeline{border-left:2px solid #e3e7ef;margin-left:8px;padding-left:18px}.tl{position:relative;margin:0 0 18px}.tl:before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #eef3ff}.tl b{font-size:12px}.tl small{display:block;color:var(--muted);margin-top:2px}
.evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.ev{height:95px;border:1px dashed #cbd3e1;border-radius:11px;background:linear-gradient(135deg,#f8fbff,#eef5ff);display:grid;place-items:center;text-align:center;color:#5c6b83;font-size:11px}
.modal{position:fixed;inset:0;background:#10182bcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;max-width:950px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 25px 80px #0004}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#dff9ff,transparent 30%),radial-gradient(circle at 80% 80%,#eee5ff,transparent 30%),#f6f8fc}.loginbox{width:min(520px,92vw);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 25px 80px #15203a16}.loginlogo{font-size:30px;font-weight:900}.loginlogo i{font-style:normal;color:var(--cyan)}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.role{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left}.role:hover{border-color:#8ba2ff;background:#f8faff}.role b{display:block}.role small{color:var(--muted)}
svg{max-width:100%}
@media(max-width:1000px){.side{width:78px}.brand small,.brand b{display:none}.nav a span:not(.ico){display:none}.nav a{justify-content:center}.sidefoot{display:none}.kpi{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.side{position:fixed;bottom:0;top:auto;width:100%;height:64px;z-index:50;padding:5px 4px}.nav{display:flex;justify-content:space-around}.navlabel{display:none}.nav a{margin:0;padding:7px;border-radius:9px}.nav a.on{box-shadow:inset 0 -3px #62e5ff}.main{padding-bottom:62px}.top{padding:10px 13px;height:62px}.top .chip:first-child{display:none}.page{padding:15px}.kpi{grid-template-columns:1fr 1fr}.three,.formgrid{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr 1fr}.head{display:block}.actions{margin-top:10px}.roles{grid-template-columns:1fr}.evidence{grid-template-columns:1fr 1fr}}

/* --- restrained government-lab styling override --- */
:root{--bg:#f3f5f8;--line:#d8dee8;--nav:#14284b;--nav2:#14284b;--blue:#14284b;--cyan:#0f766e;--purple:#b8892b;--pink:#b8892b;--green:#15803d;--amber:#b45309;--red:#b91c1c;--r:4px;--shadow:none}
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:14px}
.side{background:#14284b!important}.brand b{font-size:18px;letter-spacing:2px}.brand b i,.brand b span{color:#b8892b}.brand small{letter-spacing:0;font-size:10.5px}
.nav a{border-radius:0!important;border-left:3px solid transparent;padding:10px 12px!important}.nav a.on,.nav a.active,.nav a:hover{background:#ffffff14!important;border-left-color:#b8892b!important;color:#fff!important;box-shadow:none!important}

input,select,textarea,.testtab,.ev,.alert{border-radius:3px!important}.ev{background:#fafbfc!important}
.testtab.on{background:#14284b!important;border-color:#14284b!important}

body::after{content:"Prototype for demonstration \2022  Regulatory values and procedures require validation against the applicable OIML R 76 edition and competent laboratory requirements.";display:block;padding:10px 18px;font-size:11.5px;color:#5b6779;border-top:1px solid #d8dee8;background:#fff}
.brand{display:flex;gap:10px;align-items:center}.ico{display:inline-block!important}
.landing{max-width:1000px;margin:0 auto;padding:32px 18px}.lhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}.lhead h1{margin:0;font-size:26px;letter-spacing:3px}.lhead p{margin:2px 0;color:var(--muted)}
.mark{width:36px;height:36px;background:#14284b;color:#fff;font-weight:700;display:grid;place-items:center;letter-spacing:1px;border-bottom:3px solid #b8892b;border-radius:3px;flex:none;font-size:13px}.side .mark{background:#0d1c38}.mark.big{width:56px;height:56px;font-size:20px}
.demo{display:inline-block;font-size:11px;font-weight:600;color:#15803d;border:1px solid #15803d;padding:2px 8px;border-radius:3px;background:#fff}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:18px 0}.rcard{background:#fff;border:1px solid var(--line);border-top:3px solid #0f766e;padding:18px;display:flex;flex-direction:column;gap:8px;border-radius:4px}.rcard h3{margin:0;font-size:16px}.rcard p{margin:0;color:var(--muted);flex:1}.ricon{font-size:26px}.rcard small{color:var(--muted);font-size:10.5px;letter-spacing:.3px}
.lfoot{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
@media(max-width:680px){body::after{margin-bottom:64px}}.btn.light{background:#fff!important;color:#14284b!important;border:1px solid #b9c3d3!important}.btn.green{background:#15803d!important}.btn.red{background:#b91c1c!important}.donut:after{content:attr(data-p)!important}@media print{#root,body::after,.modalbox .actions{display:none!important}.modal{position:static!important;background:#fff!important;display:block!important;padding:0!important}.modalbox{max-width:none!important;box-shadow:none!important}}

<body>
<div id="root"></div>
<div id="modal" class="modal"></div>
<script>
const KEY="metriq_ps35_demo_v2";
const ROLES={lab:["Laboratory Officer","A. Nair"],rev:["Reviewer","R. Iyer"],adm:["Administrator","S. Menon"],own:["Instrument Owner","Demo Owner"]};
const TESTS=["Repeatability","Indication Error","Zero Return","Eccentricity","Tare","Weighing Performance","Discrimination"];
const STATUS=["Draft","Testing","Pending Review","Returned","Approved","Archived"];
const seed0=()=>({
 role:null,view:"dashboard",selected:"WR-2026-0142",
 activeTest:"Indication Error",
 rule:{name:"OIML R 76-1",edition:"Configured demonstration rule",b1:500,b2:2000,f1:.5,f2:1,f3:1.5},
 inst:[
  {id:"WR-2026-0142",mfr:"Acme Weigh Systems",model:"AWS-300",sn:"SN-2600",type:"Platform Scale",cls:"III",max:300,e:.1,d:.1,status:"Pending Review",date:"2026-09-28",owner:"Demo Owner",tests:["Indication Error","Repeatability","Eccentricity"],done:3,obs:[{t:"Indication Error",nom:150,ref:150,ind:150.03},{t:"Indication Error",nom:300,ref:300,ind:300.04},{t:"Repeatability",nom:150,ref:150,ind:150.01}],env:{temp:22.4,rh:48,pressure:1008},evidence:["setup-photo.jpg","calibration-certificate.pdf","eccentricity-photos.jpg"],comment:""},
  {id:"WR-2026-0139",mfr:"Metro Weigh Systems",model:"MWS-30T",sn:"SN-2730",type:"Weighbridge",cls:"III",max:30000,e:10,d:10,status:"Returned",date:"2026-09-22",owner:"Demo Owner 2",tests:["Indication Error","Eccentricity"],done:1,obs:[{t:"Indication Error",nom:15000,ref:15000,ind:15000}],env:{temp:23.1,rh:51,pressure:1007},evidence:["setup-photo.jpg"],comment:"Eccentricity photographs required."},
  {id:"WR-2026-0141",mfr:"Precision Weigh Ltd.",model:"PW-60",sn:"SN-2637",type:"Bench Scale",cls:"II",max:60,e:.01,d:.01,status:"Approved",date:"2026-09-25",owner:"Demo Owner 3",tests:["Indication Error","Repeatability","Zero Return"],done:3,obs:[{t:"Indication Error",nom:30,ref:30,ind:30.002},{t:"Indication Error",nom:60,ref:60,ind:59.998}],env:{temp:21.9,rh:45,pressure:1009},evidence:["setup-photo.jpg","certificate.pdf"],comment:""},
  {id:"WR-2026-0140",mfr:"National Industrial Scales",model:"NIS-1500",sn:"SN-2674",type:"Industrial Scale",cls:"III",max:1500,e:.5,d:.5,status:"Testing",date:"2026-09-24",owner:"Demo Owner 4",tests:["Indication Error","Repeatability","Eccentricity","Tare"],done:2,obs:[{t:"Indication Error",nom:750,ref:750,ind:750.12}],env:{temp:22.8,rh:49,pressure:1008},evidence:["setup-photo.jpg"],comment:""}
 ],
 audit:[
  ["10:42","A. Nair","Observation saved","WR-2026-0142","Testing"],
  ["11:15","R. Iyer","Report returned","WR-2026-0139","Returned"],
  ["12:05","A. Nair","Evidence attached","WR-2026-0142","Testing"],
  ["12:22","S. Menon","Rule configuration viewed","—","Administration"]
 ]
});
const seed=()=>{let s=seed0();s.inst.forEach(i=>{i.ver=i.ver||"1.0";i.vers=i.vers||[{v:"1.0",dt:i.date,why:"Initial issue"}];i.env=i.env||{};i.evidence=i.evidence||[];if(["Draft","Testing"].includes(i.status))return;const d={temp:"22.4",rh:"48",pressure:"1008",eq:"TE-014",rs:"RS-M1-07",op:"A. Nair"};for(const k in d)if(!i.env[k])i.env[k]=d[k];i.tests.forEach(t=>{if(!i.obs.some(o=>o.t===t)){const n=i.max/2;i.obs.push({t,nom:n,ref:n,ind:+(n+i.e*.2).toFixed(5)})}});if(i.status==="Returned"&&!i.evidence.length)i.evidence=["setup_photo.jpg"];if(["Approved","Archived"].includes(i.status)&&!i.reviewer)i.reviewer="R. Iyer"});return s};
let S=JSON.parse(localStorage.getItem(KEY)||"null")||seed(), filter={q:"",status:"",type:""};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const cur=()=>S.inst.find(x=>x.id===S.selected)||S.inst[0];
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const badge=s=>`<span class="badge ${esc(s)}">${esc(s)}</span>`;
const log=(action,id,status)=>{S.audit.unshift([new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}),ROLES[S.role]?.[1]||"System",action,id,status]);save()};
function mpe(i,load){let m=Math.abs(load)/i.e;let f=m<=S.rule.b1?S.rule.f1:m<=S.rule.b2?S.rule.f2:S.rule.f3;return +(f*i.e).toFixed(5)}
function result(i,o){let er=+(o.ind-o.ref).toFixed(5),p=mpe(i,o.nom),a=Math.abs(er);return {er,p,margin:+(p-a).toFixed(5),r:a>p?"FAIL":a>.8*p?"WARNING":"PASS"}}
function overall(i){if(!i.obs.length)return"Pending";return i.obs.some(o=>result(i,o).r==="FAIL")?"FAIL":i.obs.some(o=>result(i,o).r==="WARNING")?"WARNING":"PASS"}
function progress(i){return {Draft:8,Testing:48,"Pending Review":76,Returned:60,Approved:100,Archived:100}[i.status]||0}
function nav(v){S.view=v;save();render()}
function kpi(icon,num,label,c,click){return `<div class="card kcard" style="--c:${c};cursor:pointer" onclick="${click||""}"><div class="kicon">${icon}</div><div class="kv">${num}</div><div class="kl">${label}</div></div>`}
function chart(vals){let mx=Math.max(...vals.map(x=>x[1]),1);return `<div class="chart">${vals.map(x=>`<div class="barcol"><b>${x[1]}</b><div class="bar" style="height:${Math.max(4,x[1]/mx*165)}px"></div><small>${x[0]}</small></div>`).join("")}</div>`}
function shell(content){
 const G=[["Monitoring",[["dashboard","📊","Dashboard"],["reports","📋","Report Repository"]]],["Evaluation",[["instruments","⚖️","Instruments"],["testing","🧪","Testing Workbench"],["verify","✅","Verify Report"]]],["Records",[["audit","🧾","Audit Trail"],["admin","⚙️","Rule Configuration","adm"]]],["System",[["arch","🏗️","Platform Architecture"]]]];
 const O=[["Portal",[["owner","🏭","Owner Portal"],["dashboard","📊","Dashboard"],["verify","✅","Verify Report"]]],["System",[["arch","🏗️","Platform Architecture"]]]];
 const groups=(S.role==="own"?O:G).map(g=>[g[0],g[1].filter(n=>!n[3]||n[3]===S.role)]).filter(g=>g[1].length);

function addFiles(el){let i=cur();[...el.files].forEach(f=>i.evidence.push(esc(f.name)));log("Evidence attached",i.id,i.status);render()}
function submitReview(){let i=cur(),b=blockers(i);if(b.length)return toast("Cannot submit — incomplete: "+b.join(", "));if(i.status==="Returned"){i.ver=(+(i.ver||"1.0")+.1).toFixed(1);(i.vers=i.vers||[]).push({v:i.ver,dt:new Date().toISOString().slice(0,10),why:"Resubmitted after review comment"})}i.status="Pending Review";log("Submitted for review",i.id,i.status);toast("Submitted for review");render()}
function approve(){let i=cur();if(S.role!=="rev"||i.status!=="Pending Review")return;let b=blockers(i);if(b.length)return toast("Cannot approve — required data missing: "+b.join(", "));i.status="Approved";i.reviewer=ROLES.rev[1];i.comment="";log("Report approved",i.id,i.status);toast("Report approved");render()}
function returnReport(){let i=cur();if(S.role!=="rev"||i.status!=="Pending Review")return;let c=(prompt("Reviewer comment (required):","")||"").trim();if(!c)return toast("A reviewer comment is required to return a report");i.status="Returned";i.comment=c;i.reviewer=ROLES.rev[1];log("Report returned",i.id,i.status);toast("Returned to laboratory");render()}

function pageReports(){
 let L=S.inst.filter(i=>(!filter.q||(i.id+i.mfr+i.model+i.sn).toLowerCase().includes(filter.q.toLowerCase()))&&(!filter.status||i.status===filter.status));L=[...L].sort((a,b)=>filter.sort==="mfr"?a.mfr.localeCompare(b.mfr):filter.sort==="status"?a.status.localeCompare(b.status):b.date.localeCompare(a.date));
 return `<section class="page"><div class="head"><div><h1>Report Repository</h1><p>Search, review and generate standardized digital reports.</p></div><button class="btn blue" onclick="newInstrument()">New evaluation</button></div><div class="card"><div class="searchbar"><input placeholder="Search report ID, model, serial, manufacturer" value="${esc(filter.q)}" oninput="filter.q=this.value;render()"><select onchange="filter.status=this.value;render()"><option value="">All statuses</option>${STATUS.map(x=>`<option ${filter.status===x?"selected":""}>${x}</option>`).join("")}</select><select onchange="filter.sort=this.value;render()"><option value="">Newest first</option><option value="mfr" ${filter.sort==="mfr"?"selected":""}>Manufacturer</option><option value="status" ${filter.sort==="status"?"selected":""}>Status</option></select><button class="btn light" onclick="filter={q:'',status:'',type:''};render()">Reset</button></div>${tableRows(L)}</div></section>`;
}
function pageVerify(){return `<section class="page"><div class="head"><div><h1>Report Verification</h1><p>Public-style verification screen for approved reports.</p></div></div><div class="grid two"><div class="card"><h3>Enter report number</h3><input id="verifyInput" placeholder="e.g. WR-2026-0141" onkeydown="if(event.key==='Enter')verify()"><button class="btn blue" style="margin-top:10px" onclick="verify()">Verify report</button><div id="verifyResult"></div></div><div class="card"><h3>Verification chain</h3><div class="timeline"><div class="tl"><b>1. Report lookup</b><small>Find report in repository</small></div><div class="tl"><b>2. Approval status</b><small>Confirm report is approved/archived</small></div><div class="tl"><b>3. Record snapshot</b><small>Display instrument and evaluation metadata</small></div><div class="tl"><b>4. QR / signature layer</b><small>Integration point for production cryptographic verification</small></div></div></div></div></section>`}
function verify(){let q=document.getElementById("verifyInput").value.trim().toUpperCase(),i=S.inst.find(x=>x.id===q),box=document.getElementById("verifyResult");if(!i||!["Approved","Archived"].includes(i.status)){box.innerHTML=`<div class="alert danger" style="margin-top:15px">✕ ${i?"Report found, but status is "+i.status+".":"No report found."}</div>`;return}box.innerHTML=`<div class="alert success" style="margin-top:15px"><b>✓ Valid approved report record</b><br>${i.id} • ${i.mfr} • ${i.model}<br>Evaluation date: ${i.date}<br>Status: ${i.status}<br>Report version: ${i.ver||"1.0"}<div style="margin-top:10px">${fakeQR(i.id)}</div><small>Demo QR visual only — not cryptographically secure.</small></div>`;log("Verification lookup",q,i.status)}
function fakeQR(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))>>>0;let cells="";for(let y=0;y<21;y++)for(let x=0;x<21;x++){let finder=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);h=(h*1664525+1013904223)>>>0;if(finder||((h>>>28)&1))cells+=`<rect x="${x*4}" y="${y*4}" width="4" height="4"/>`}return `<svg viewBox="0 0 84 84" width="90" style="background:#fff;border:5px solid #fff">${cells}</svg>`}

function pageAudit(){return `<section class="page"><div class="head"><div><h1>Audit Trail</h1><p>Traceable actions across testing, review and reporting.</p></div></div><div class="card"><div class="tw"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Reference</th><th>Status</th></tr></thead><tbody>${S.audit.slice(0,60).map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[3]}</td><td>${badge(a[4])}</td></tr>`).join("")}</tbody></table></div></div></section>`}
function pageAdmin(){return `<section class="page"><div class="head"><div><h1>Administration</h1><p>Versioned calculation configuration and access overview.</p></div></div><div class="grid two"><div class="card"><h3>Active rule set</h3><div class="alert">⚙ <b>${S.rule.name}</b><br>${S.rule.edition}<br><small>All values below are demonstration configuration, not official regulatory values.</small></div><div class="formgrid" style="margin-top:13px">${[["b1","Band 1 upper (e)"],["b2","Band 2 upper (e)"],["f1","MPE factor 1"],["f2","MPE factor 2"],["f3","MPE factor 3"]].map(x=>`<div><label>${x[1]}</label><input type="number" step="any" value="${S.rule[x[0]]}" onchange="setRule('${x[0]}',this.value)"></div>`).join("")}</div></div><div class="card"><h3>Role permissions</h3>${[["Laboratory Officer","Register • test • attach evidence • submit"],["Reviewer","Review • approve • return"],["Administrator","Rules • users • audit"],["Instrument Owner","Read-only status and reports"]].map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${x[0]}</b><br><span class="tiny">${x[1]}</span></div>`).join("")}</div></div><div class="card" style="margin-top:16px"><h3>Future-ready rule architecture</h3><p class="muted">The UI keeps calculation parameters outside the screen templates so a validated future OIML edition can be represented as a separate versioned rule set rather than rewriting the whole application.</p></div></section>`}
function pageOwner(){let i=cur();return `<section class="page"><div class="head"><div><h1>Instrument Owner Portal</h1><p>Read-only view of evaluation status and approved records.</p></div></div><div class="card"><label>Select instrument</label><select onchange="S.selected=this.value;render()">${S.inst.map(x=>`<option value="${x.id}" ${x.id===i.id?"selected":""}>${x.mfr} ${x.model} — ${x.sn}</option>`).join("")}</select></div><div class="grid three" style="margin-top:16px">${kpi("⚖",i.model,"Model","#3b5bdb")}${kpi("◈",progress(i)+"%","Testing progress","#08a6c7")}${kpi("✓",i.status,"Current status","#13a36b")}</div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Instrument summary</h3>${[["Manufacturer",i.mfr],["Serial",i.sn],["Type",i.type],["Accuracy class",i.cls],["Capacity",i.max+" kg"],["Scale interval e",i.e+" kg"]].map(x=>`<div class="minirow"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div><div class="card"><h3>Documents</h3>${i.evidence.map(x=>`<div style="padding:9px;border-bottom:1px solid var(--line)"> ${x}</div>`).join("")||"<p class='muted'>No documents available.</p>"}${["Approved","Archived"].includes(i.status)?`<button class="btn green" style="margin-top:12px" onclick="reportModal('${i.id}')">View report</button>`:""}</div></div></section>`}

function reportModal(id){
 let i=S.inst.find(x=>x.id===id), rows=i.obs.map(o=>{let r=result(i,o);return `<tr><td>${o.t}</td><td>${o.nom}</td><td>${o.ref}</td><td>${o.ind}</td><td>${r.er}</td><td>±${r.p}</td><td>${badge(r.r)}</td></tr>`}).join("");
 document.getElementById("modal").innerHTML=`<div class="modalbox"><div class="head"><div><h1 style="font-size:21px">Test Report — ${i.id}</h1><p>Non-Automatic Weighing Instrument • ${S.rule.name}</p></div><div class="actions"><button class="btn blue" onclick="window.print()">Print / PDF</button><button class="btn light" onclick="closeModal()">Close</button></div></div>${i.status==="Approved"||i.status==="Archived"?"":"<div class='alert'>DRAFT / NOT APPROVED — prototype record</div>"}<div class="grid two" style="margin-top:15px"><div class="card"><h3>Instrument details</h3>${[["Applicant",i.owner],["Manufacturer",i.mfr],["Model",i.model],["Serial",i.sn],["Type",i.type],["Class",i.cls],["Max",i.max+" kg"],["e / d",i.e+" / "+i.d+" kg"]].map(x=>`<div class="minirow"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div><div class="card"><h3>Evaluation summary</h3><div style="font-size:28px;font-weight:900">${overall(i)}</div><p class="muted">${i.obs.length} observations • ${i.evidence.length} attachments<br>Indicative result from demonstration criteria, not a regulatory determination.</p><div class="progress"><i style="width:${progress(i)}%"></i></div></div></div><div class="card" style="margin-top:15px"><h3>Test observations</h3><div class="tw"><table><thead><tr><th>Test</th><th>Nominal</th><th>Reference</th><th>Indicated</th><th>Error</th><th>MPE</th><th>Result</th></tr></thead><tbody>${rows||"<tr><td colspan='7'>No observations</td></tr>"}</tbody></table></div></div><div class="card" style="margin-top:15px"><h3>Environment & evidence</h3><p>Temperature: ${i.env.temp||"—"} °C • Humidity: ${i.env.rh||"—"}% • Pressure: ${i.env.pressure||"—"} hPa</p><p>Test equipment: ${i.env.eq||"—"} • Reference standard: ${i.env.rs||"—"} • Operator: ${i.env.op||"—"}</p><p>Attachments: ${i.evidence.join(", ")||"None"}</p></div><div class="card" style="margin-top:15px"><h3>Review &amp; approval</h3><p>Version ${i.ver||"1.0"} • Evaluation date ${i.date} • Reviewer: ${i.reviewer||"Pending"} • Status: ${i.status}</p>${i.comment?`<p><b>Reviewer comment:</b> ${esc(i.comment)}</p>`:""}<p>Revision history: ${(i.vers||[{v:i.ver||"1.0",dt:i.date,why:"Initial issue"}]).map(v=>`v${v.v} (${v.dt}: ${v.why})`).join("; ")}</p><div style="height:44px;border-bottom:1px solid #999;width:260px;margin-top:8px"></div><small>Authorised signatory (signature on approved copy)</small></div><div class="tiny" style="margin-top:14px">Prototype report. Regulatory values and procedures require validation against the applicable official OIML R 76 edition and competent laboratory requirements.</div></div>`;
 document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function toast(msg){let t=document.createElement("div");t.textContent=msg;t.style.cssText="position:fixed;right:18px;bottom:85px;background:#172033;color:#fff;padding:12px 16px;border-radius:11px;z-index:200;box-shadow:0 10px 30px #0003";document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
render();
</script>
</body>
</html>
